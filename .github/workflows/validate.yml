name: Validate Schemas

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Validate JSON Schemas
      run: |
        for schema in schemas/v1.6.0/*.schema.json; do
          jq empty "$schema" || exit 1
        done
    - name: Check Schema Count
      run: |
        COUNT=$(ls -1 schemas/v1.6.0/*.schema.json | wc -l)
        if [ "$COUNT" -ne 23 ]; then
          echo "Expected 23 schemas, found $COUNT"
          exit 1
        fi

  conformance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # the release-gating test compares the .unreleased marker against
        # the tag list; a tagless shallow clone would make it vacuous.
        fetch-tags: true
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - uses: cue-lang/setup-cue@v1
      with:
        version: v0.17.1
    - run: uv python install 3.12
    - run: uv sync --group test
    - run: uv run pytest
