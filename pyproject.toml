[project]
name = "dis-conformance"
version = "0.0.0"
description = "Conformance tests for the Domain Intelligence Schema"
requires-python = ">=3.11"

[dependency-groups]
test = ["pytest>=8", "rdflib>=7", "pyshacl>=0.30", "jsonschema>=4.20", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
addopts = "-ra"
